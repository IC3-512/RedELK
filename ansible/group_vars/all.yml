---
####################################################################################################
# How Ansible REACHES the hosts.
#
# Nothing about WHAT RedELK deploys belongs in this file - that all lives in ../redelk.yml and is
# turned into artefacts by ./redelkctl. If you find yourself adding a RedELK setting here, it
# belongs in redelk.yml instead.
####################################################################################################

# Escalation is a play keyword in playbook.yml, NOT ansible_become here.
#
# ansible_become is a magic connection variable, and a variable beats a task keyword - so with it
# set, every `become: false` in the roles was silently ignored, including the ones on
# delegate_to: localhost tasks (the implicit localhost is a member of `all`). redelkctl therefore
# ran as root on the CONTROL NODE and left redelk.secrets.yml, build/ and certs/ owned by root in
# the operator's own checkout, after which any unprivileged `./redelkctl validate` fails with a
# permission error and every later deploy is wedged.
#
# Passwordless sudo on the targets is still required: the repository is copied with rsync, which
# runs 'sudo rsync' on the far end and cannot answer a password prompt.

# The RedELK repository on the control node: the directory holding redelk.yml and ./redelkctl.
redelk_repo_path: "{{ playbook_dir | dirname }}"

# The configuration file redelkctl reads, relative to redelk_repo_path.
redelk_config_file: redelk.yml

# Where './redelkctl generate' writes the per-host installation packages.
redelk_packages_path: "{{ redelk_repo_path }}/build/packages"

# Where RedELK lands on the remote hosts: the repository on the server, the host's package on the
# redirectors and C2 servers.
redelk_remote_base_path: /opt/redelk

---
# RedELK clients install (C2 and redirectors) tasks
- name: Install dependency packages
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - python3-pip
    state: present
    update_cache: true
  tags:
    - packages

- name: Install Elastic repository
  become: true
  tags:
    - packages
  block:
    - name: Add Elastic GPG key
      ansible.builtin.apt_key:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present

    - name: Add Elastic APT repository
      ansible.builtin.apt_repository:
        repo: deb https://artifacts.elastic.co/packages/7.x/apt stable main
        state: present
        filename: elastic-7.x

- name: Install Filebeat package
  become: true
  ansible.builtin.apt:
    name:
      - "{{ redelk_filebeat_package }}"
    state: present
    update_cache: true
  tags:
    - packages

- name: Install C2-side package requirements
  become: true
  ansible.builtin.apt:
    name:
      - rsync
      - rush
    state: present
    update_cache: true
  when: "'c2servers' in group_names"
  tags:
    - packages

- name: Install C2-side Python requirements
  become: true
  ansible.builtin.pip:
    name:
      - javaobj-py3
    break_system_packages: "{{ ansible_facts['distribution_version'] is version('24.04', '>=') }}"
  when: "'c2servers' in group_names"
  tags:
    - packages

- name: Setup filebeat-side connector package
  ansible.builtin.import_tasks: filebeat.yml
  tags:
    - filebeat
    - beats

- name: Setup C2-side connector extras
  ansible.builtin.import_tasks: c2.yml
  tags:
    - c2
  when: "'c2servers' in group_names"

---
- name: Determine RedELK server install type
  ansible.builtin.set_fact:
    redelk_server_install_type: >-
      {%- if redelk_install_type | default('') | trim -%}
      {{ redelk_install_type | trim }}
      {%- elif ' limited' in (' ' ~ redelk_elk_install_command) -%}
      limited
      {%- elif ' dev' in (' ' ~ redelk_elk_install_command) -%}
      dev
      {%- else -%}
      full
      {%- endif -%}

- name: Determine whether RedELK fixed memory mode is enabled
  ansible.builtin.set_fact:
    redelk_server_fixedmemory: >-
      {{
        (redelk_fixedmemory | bool)
        or (' fixedmemory' in (' ' ~ redelk_elk_install_command))
      }}

- name: Set Elasticsearch memory for limited install
  ansible.builtin.set_fact:
    redelk_server_es_memory: "{{ item.es }}"
  loop:
    - { min: 0, max: 4000, es: "512m" }
    - { min: 4000, max: 5000, es: "1g" }
    - { min: 5000, max: 6000, es: "1g" }
    - { min: 6000, max: 7000, es: "2g" }
    - { min: 7000, max: 8000, es: "2g" }
    - { min: 8000, max: 9000, es: "3g" }
    - { min: 9000, max: 10000, es: "3g" }
    - { min: 10000, max: 11000, es: "4g" }
    - { min: 11000, max: 12000, es: "4g" }
    - { min: 12000, max: 13000, es: "5g" }
    - { min: 13000, max: 14000, es: "5g" }
    - { min: 14000, max: 15000, es: "6g" }
    - { min: 15000, max: 16000, es: "6g" }
    - { min: 16000, max: 17000, es: "7g" }
    - { min: 17000, max: 18000, es: "7g" }
    - { min: 18000, max: 19000, es: "8g" }
    - { min: 19000, max: 20000, es: "8g" }
    - { min: 20000, max: 999999, es: "9g" }
  loop_control:
    label: "{{ item.es }}"
  when:
    - redelk_server_install_type == 'limited'
    - ansible_facts['memory_mb']['real']['total'] >= item.min
    - ansible_facts['memory_mb']['real']['total'] < item.max

- name: Set Elasticsearch and Neo4j memory for full-style install
  ansible.builtin.set_fact:
    redelk_server_es_memory: "{{ item.es }}"
    redelk_server_neo4j_memory: "{{ item.neo4j }}"
  when:
    - redelk_server_install_type != 'limited'
    - not redelk_server_fixedmemory | bool
    - ansible_facts['memory_mb']['real']['total'] >= item.min
    - ansible_facts['memory_mb']['real']['total'] < item.max
  loop:
    - { min: 8000, max: 9000, es: "1g", neo4j: "2G" }
    - { min: 9000, max: 10000, es: "1g", neo4j: "3G" }
    - { min: 10000, max: 11000, es: "2g", neo4j: "3G" }
    - { min: 11000, max: 12000, es: "2g", neo4j: "4G" }
    - { min: 12000, max: 13000, es: "2g", neo4j: "4G" }
    - { min: 13000, max: 14000, es: "2g", neo4j: "5G" }
    - { min: 14000, max: 15000, es: "3g", neo4j: "5G" }
    - { min: 15000, max: 16000, es: "3g", neo4j: "6G" }
    - { min: 16000, max: 17000, es: "3g", neo4j: "6G" }
    - { min: 17000, max: 18000, es: "3g", neo4j: "7G" }
    - { min: 18000, max: 19000, es: "4g", neo4j: "7G" }
    - { min: 19000, max: 20000, es: "4g", neo4j: "8G" }
    - { min: 20000, max: 999999, es: "4g", neo4j: "8G" }

- name: Set fixed memory values for low-memory full install
  ansible.builtin.set_fact:
    redelk_server_es_memory: "1g"
    redelk_server_neo4j_memory: "1G"
  when:
    - redelk_server_install_type != 'limited'
    - redelk_server_fixedmemory | bool
    - ansible_facts['memory_mb']['real']['total'] < 8000

- name: Fail when full install is selected on low-memory hosts
  ansible.builtin.fail:
    msg: >-
      Full RedELK install requires at least 8 GB RAM. Current host reports
      {{ ansible_facts['memory_mb']['real']['total'] }} MB. Use a larger host or switch
      `redelk_install_type` to `limited`.
  when:
    - redelk_server_install_type != 'limited'
    - not redelk_server_fixedmemory | bool
    - ansible_facts['memory_mb']['real']['total'] < 8000

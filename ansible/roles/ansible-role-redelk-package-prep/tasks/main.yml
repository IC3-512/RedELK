---
- name: Prepare RedELK deployment packages on control node
  run_once: true
  delegate_to: localhost
  block:
    - name: Check OpenSSL config path exists
      ansible.builtin.stat:
        path: "{{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}"
      register: redelk_package_openssl_config

    - name: Fail when OpenSSL config is missing
      ansible.builtin.fail:
        msg: >-
          Missing OpenSSL config {{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}.
      when: not redelk_package_openssl_config.stat.exists

    - name: Read OpenSSL config
      ansible.builtin.slurp:
        src: "{{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}"
      register: redelk_package_openssl_config_content

    - name: Fail when OpenSSL config still contains placeholder values
      ansible.builtin.assert:
        that:
          - redelk_package_openssl_config_content.content | b64decode is not search('MODIFYME')
          - redelk_package_openssl_config_content.content | b64decode is not search('dnsnameofyourredelkserver')
          - redelk_package_openssl_config_content.content | b64decode is not search('someseconddnsname')
          - redelk_package_openssl_config_content.content | b64decode is not search('123\\.123\\.123\\.123')
        fail_msg: >-
          OpenSSL config {{ redelk_openssl_config_path }} still contains example placeholder values.

    - name: Ensure required local commands are available
      ansible.builtin.shell: "command -v {{ item }} >/dev/null 2>&1"
      changed_when: false
      loop:
        - openssl
        - ssh-keygen
        - tar

    - name: Find example files in repository
      ansible.builtin.find:
        paths: "{{ redelk_local_repo_path }}"
        recurse: true
        patterns: '*.example'
        file_type: file
      register: redelk_package_example_files

    - name: Check whether target files already exist
      ansible.builtin.stat:
        path: "{{ item.path | regex_replace('\\.example$', '') }}"
      loop: "{{ redelk_package_example_files.files }}"
      register: redelk_package_example_targets

    - name: Copy example files into missing runtime files
      ansible.builtin.copy:
        src: "{{ item.item.path }}"
        dest: "{{ item.item.path | regex_replace('\\.example$', '') }}"
        remote_src: true
        mode: preserve
        force: false
      loop: "{{ redelk_package_example_targets.results }}"
      when: not item.stat.exists

    - name: Ensure certificate directory exists
      ansible.builtin.file:
        path: "{{ redelk_local_repo_path }}/certs"
        state: directory
        mode: '0755'

    - name: Generate RedELK CA private key
      ansible.builtin.command:
        argv:
          - openssl
          - genrsa
          - -out
          - "{{ redelk_local_repo_path }}/certs/redelkCA.key"
          - '2048'
      args:
        creates: "{{ redelk_local_repo_path }}/certs/redelkCA.key"

    - name: Generate RedELK CA certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -new
          - -x509
          - -days
          - '3650'
          - -nodes
          - -key
          - "{{ redelk_local_repo_path }}/certs/redelkCA.key"
          - -sha256
          - -out
          - "{{ redelk_local_repo_path }}/certs/redelkCA.crt"
          - -extensions
          - v3_ca
          - -config
          - "{{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}"
      args:
        creates: "{{ redelk_local_repo_path }}/certs/redelkCA.crt"

    - name: Generate ELK server private key
      ansible.builtin.command:
        argv:
          - openssl
          - genrsa
          - -out
          - "{{ redelk_local_repo_path }}/certs/elkserver.key"
          - '2048'
      args:
        creates: "{{ redelk_local_repo_path }}/certs/elkserver.key"

    - name: Generate ELK server certificate signing request
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -sha512
          - -new
          - -key
          - "{{ redelk_local_repo_path }}/certs/elkserver.key"
          - -out
          - "{{ redelk_local_repo_path }}/certs/elkserver.csr"
          - -config
          - "{{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}"
      args:
        creates: "{{ redelk_local_repo_path }}/certs/elkserver.csr"

    - name: Sign ELK server certificate with RedELK CA
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -days
          - '3650'
          - -req
          - -sha512
          - -in
          - "{{ redelk_local_repo_path }}/certs/elkserver.csr"
          - -CAcreateserial
          - -CA
          - "{{ redelk_local_repo_path }}/certs/redelkCA.crt"
          - -CAkey
          - "{{ redelk_local_repo_path }}/certs/redelkCA.key"
          - -out
          - "{{ redelk_local_repo_path }}/certs/elkserver.crt"
          - -extensions
          - v3_req
          - -extfile
          - "{{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}"
      args:
        creates: "{{ redelk_local_repo_path }}/certs/elkserver.crt"

    - name: Convert ELK private key to PKCS8 format
      ansible.builtin.shell: |
        cp "{{ redelk_local_repo_path }}/certs/elkserver.key" "{{ redelk_local_repo_path }}/certs/elkserver.key.pem"
        openssl pkcs8 -in "{{ redelk_local_repo_path }}/certs/elkserver.key.pem" -topk8 -nocrypt -out "{{ redelk_local_repo_path }}/certs/elkserver.key"
      args:
        creates: "{{ redelk_local_repo_path }}/certs/elkserver.key.pem"

    - name: Ensure package output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ redelk_local_repo_path }}/elkserver/mounts/logstash-config/certs_inputs"
        - "{{ redelk_local_repo_path }}/elkserver/initial-setup-data/certs"
        - "{{ redelk_local_repo_path }}/c2servers/filebeat"
        - "{{ redelk_local_repo_path }}/redirs/filebeat"
        - "{{ redelk_local_repo_path }}/elkserver/mounts/redelk-ssh"
        - "{{ redelk_local_repo_path }}/c2servers/ssh"
        - "{{ redelk_package_ssh_dir }}"

    - name: Find generated certificate files
      ansible.builtin.find:
        paths: "{{ redelk_local_repo_path }}/certs"
        recurse: false
        file_type: file
      register: redelk_package_cert_files

    - name: Copy certificates into ELK server input certificate directory
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ redelk_local_repo_path }}/elkserver/mounts/logstash-config/certs_inputs/{{ item.path | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ redelk_package_cert_files.files }}"

    - name: Copy certificates into ELK server initial setup directory
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ redelk_local_repo_path }}/elkserver/initial-setup-data/certs/{{ item.path | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ redelk_package_cert_files.files }}"

    - name: Copy RedELK CA certificate to client package directories
      ansible.builtin.copy:
        src: "{{ redelk_local_repo_path }}/certs/redelkCA.crt"
        dest: "{{ item }}"
        remote_src: true
        mode: preserve
      loop:
        - "{{ redelk_local_repo_path }}/c2servers/filebeat/redelkCA.crt"
        - "{{ redelk_local_repo_path }}/redirs/filebeat/redelkCA.crt"

    - name: Generate SSH key pair for RedELK sync user
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - rsa
          - -f
          - "{{ redelk_package_ssh_dir }}/id_rsa"
          - -N
          - ''
      args:
        creates: "{{ redelk_package_ssh_dir }}/id_rsa"

    - name: Copy sync public key into C2 package
      ansible.builtin.copy:
        src: "{{ redelk_package_ssh_dir }}/id_rsa.pub"
        dest: "{{ redelk_local_repo_path }}/c2servers/ssh/id_rsa.pub"
        remote_src: true
        mode: preserve

    - name: Copy sync key pair into ELK server package
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: preserve
      loop:
        - src: "{{ redelk_package_ssh_dir }}/id_rsa"
          dest: "{{ redelk_local_repo_path }}/elkserver/mounts/redelk-ssh/id_rsa"
        - src: "{{ redelk_package_ssh_dir }}/id_rsa.pub"
          dest: "{{ redelk_local_repo_path }}/elkserver/mounts/redelk-ssh/id_rsa.pub"

    - name: Check if VERSION file exists
      ansible.builtin.stat:
        path: "{{ redelk_local_repo_path }}/VERSION"
      register: redelk_package_version_file

    - name: Copy VERSION file into package directories
      ansible.builtin.copy:
        src: "{{ redelk_local_repo_path }}/VERSION"
        dest: "{{ item }}"
        remote_src: true
        mode: preserve
      when: redelk_package_version_file.stat.exists
      loop:
        - "{{ redelk_local_repo_path }}/c2servers/VERSION"
        - "{{ redelk_local_repo_path }}/elkserver/VERSION"
        - "{{ redelk_local_repo_path }}/redirs/VERSION"

    - name: Create package archives
      ansible.builtin.command:
        argv:
          - tar
          - zcf
          - "{{ item.dest }}"
          - -C
          - "{{ redelk_local_repo_path }}"
          - "{{ item.name }}"
      loop: "{{ redelk_package_archives }}"

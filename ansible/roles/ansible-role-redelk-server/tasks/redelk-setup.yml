---
- name: Ensure local ELK server package exists
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ redelk_local_repo_path }}/elkserver.tgz"
  register: redelk_server_local_package

- name: Fail when ELK server package is missing
  ansible.builtin.fail:
    msg: >-
      Missing package {{ redelk_local_repo_path }}/elkserver.tgz.
      Generate it with the package prep role or provide a prebuilt archive.
  when:
    - redelk_extract_server_package | bool
    - not redelk_server_local_package.stat.exists

- name: Validate Let's Encrypt settings
  ansible.builtin.assert:
    that:
      - redelk_external_domain | trim | length > 0
    fail_msg: >-
      Set redelk_external_domain when redelk_letsencrypt_enabled is true.
  when: redelk_letsencrypt_enabled | bool

- name: Set RedELK server deployment facts
  ansible.builtin.set_fact:
    redelk_server_path: "{{ redelk_remote_base_path }}/elkserver"
    redelk_server_compose_file: "redelk-{{ redelk_server_install_type }}.yml"
    redelk_server_env_external_domain: >-
      {{ redelk_external_domain if redelk_letsencrypt_enabled else redelk_self_signed_cert_dirname }}
    redelk_server_env_le_email: >-
      {{ redelk_letsencrypt_email if redelk_letsencrypt_enabled else redelk_self_signed_cert_dirname }}
    redelk_server_bloodhound_enabled: "{{ redelk_server_install_type != 'limited' }}"

- name: Ensure deployment directory exists
  ansible.builtin.file:
    path: "{{ redelk_remote_base_path }}"
    state: directory
    mode: "0755"

- name: Check if ELK server package was already extracted
  ansible.builtin.stat:
    path: "{{ redelk_remote_base_path }}/.ansible_redelk_package_extracted"
  register: redelk_server_extract_marker

- name: Upload and extract ELK server package
  ansible.builtin.unarchive:
    src: "{{ redelk_local_repo_path }}/elkserver.tgz"
    dest: "{{ redelk_remote_base_path }}"
    mode: "0755"
  when:
    - redelk_extract_server_package | bool
    - redelk_force_extract_server_package | bool or not redelk_server_extract_marker.stat.exists

- name: Create package extraction marker
  ansible.builtin.copy:
    content: ""
    dest: "{{ redelk_remote_base_path }}/.ansible_redelk_package_extracted"
    mode: "0600"
    force: false

- name: Read packaged VERSION file
  ansible.builtin.slurp:
    src: "{{ redelk_server_path }}/VERSION"
  register: redelk_server_version_file

- name: Set RedELK version fact
  ansible.builtin.set_fact:
    redelk_server_version: "{{ redelk_server_version_file.content | b64decode | trim }}"

- name: Check for existing .env file
  ansible.builtin.stat:
    path: "{{ redelk_server_path }}/.env"
  register: redelk_server_env_stat

- name: Read existing .env file
  ansible.builtin.slurp:
    src: "{{ redelk_server_path }}/.env"
  register: redelk_server_env_existing
  when: redelk_server_env_stat.stat.exists

- name: Check for existing BloodHound config
  ansible.builtin.stat:
    path: "{{ redelk_server_path }}/mounts/bloodhound-config/bloodhound.config.json"
  register: redelk_server_bloodhound_config_stat
  when: redelk_server_bloodhound_enabled | bool

- name: Read existing BloodHound config
  ansible.builtin.slurp:
    src: "{{ redelk_server_path }}/mounts/bloodhound-config/bloodhound.config.json"
  register: redelk_server_bloodhound_config_existing
  when:
    - redelk_server_bloodhound_enabled | bool
    - redelk_server_bloodhound_config_stat.stat.exists

- name: Set RedELK secret facts
  ansible.builtin.set_fact:
    redelk_server_existing_env_content: "{{ (redelk_server_env_existing.content | b64decode) if redelk_server_env_stat.stat.exists else '' }}"
    redelk_server_existing_bloodhound_config_content: >-
      {{ (redelk_server_bloodhound_config_existing.content | b64decode)
         if (redelk_server_bloodhound_enabled | bool and redelk_server_bloodhound_config_stat.stat.exists)
         else '' }}

- name: Resolve RedELK secret values
  ansible.builtin.set_fact:
    redelk_server_kibana_system_password: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^CREDS_kibana_system=(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_logstash_system_password: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^CREDS_logstash_system=(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_redelk_ingest_password: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^CREDS_redelk_ingest=(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_redelk_password: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^CREDS_redelk=(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_elastic_password: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^ELASTIC_PASSWORD=(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_kibana_encryption_key: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^KBN_XPACK_ENCRYPTEDSAVEDOBJECTS=(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_neo4j_password: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^NEO4J_AUTH=neo4j/(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_postgres_password: >-
      {{ (redelk_server_existing_env_content | regex_findall('(?m)^POSTGRES_PASSWORD=(.+)$') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_bloodhound_password: >-
      {{ (redelk_server_existing_bloodhound_config_content | regex_findall('"password":\s*"([^"]+)"') | first)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    redelk_server_bloodhound_admin_email: >-
      {{ (redelk_server_existing_bloodhound_config_content | regex_findall('"email_address":\s*"([^"]+)"') | first)
         | default(redelk_letsencrypt_email | default('redelk@example.com', true), true) }}

- name: Ensure RedELK runtime directories exist
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "mounts/certbot/conf/live", owner: "1000", group: "1000" }
    - { path: "mounts/jupyter-workbooks", owner: "1000", group: "1000" }
    - { path: "mounts/redelk-logs", owner: "1000", group: "1000" }
    - { path: "mounts/redelk-www", owner: "1000", group: "1000" }
    - { path: "mounts/logstash-config", owner: "1000", group: "1000" }
    - { path: "mounts/elasticsearch-config/jvm.options.d", owner: "1000", group: "1000" }

- name: Create Docker environment file on first deployment
  become: true
  ansible.builtin.template:
    src: docker-env.j2
    dest: "{{ redelk_server_path }}/.env"
    mode: "0640"
    force: false

- name: Create RedELK config file on first deployment
  become: true
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ redelk_server_path }}/mounts/redelk-config/etc/redelk/config.json"
    mode: "0644"
    force: false

- name: Create BloodHound config on first deployment
  become: true
  ansible.builtin.template:
    src: bloodhound.config.json.j2
    dest: "{{ redelk_server_path }}/mounts/bloodhound-config/bloodhound.config.json"
    mode: "0644"
    force: false
  when: redelk_server_bloodhound_enabled | bool

- name: Create RedELK password reference file on first deployment
  become: true
  ansible.builtin.template:
    src: redelk_passwords.cfg.j2
    dest: "{{ redelk_server_path }}/redelk_passwords.cfg"
    mode: "0600"
    force: false

- name: Copy password reference file for Jupyter notebooks on first deployment
  become: true
  ansible.builtin.template:
    src: redelk_passwords.cfg.j2
    dest: "{{ redelk_server_path }}/mounts/jupyter-workbooks/redelk_passwords.py"
    mode: "0600"
    force: false

- name: Create htpasswd file for RedELK web access
  become: true
  ansible.builtin.command:
    cmd: >-
      htpasswd -b -c {{ redelk_server_path }}/mounts/nginx-config/htpasswd.users.template
      {{ redelk_redelk_username }} {{ redelk_server_redelk_password }}
  args:
    creates: "{{ redelk_server_path }}/mounts/nginx-config/htpasswd.users.template"

- name: Set Elasticsearch JVM heap minimum
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/elasticsearch-config/jvm.options.d/jvm.options"
    regexp: '^-Xms.*$'
    line: "-Xms{{ redelk_server_es_memory }}"

- name: Set Elasticsearch JVM heap maximum
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/elasticsearch-config/jvm.options.d/jvm.options"
    regexp: '^-Xmx.*$'
    line: "-Xmx{{ redelk_server_es_memory }}"

- name: Disable full-only nginx locations for limited install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*include conf\.d/full\.location-conf;\s*$'
    line: '    # include conf.d/full.location-conf;'
  when: not (redelk_server_bloodhound_enabled | bool)

- name: Disable full-only nginx BloodHound location for limited install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*include conf\.d/full\.bloodhound-conf;\s*$'
    line: '# include conf.d/full.bloodhound-conf;'
  when: not (redelk_server_bloodhound_enabled | bool)

- name: Enable full nginx locations for full-style install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*#\s*include conf\.d/full\.location-conf;\s*$'
    line: '    include conf.d/full.location-conf;'
  when: redelk_server_bloodhound_enabled | bool

- name: Enable full nginx BloodHound location for full-style install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*#\s*include conf\.d/full\.bloodhound-conf;\s*$'
    line: 'include conf.d/full.bloodhound-conf;'
  when: redelk_server_bloodhound_enabled | bool

- name: Link docker-compose.yml to selected RedELK stack file
  become: true
  ansible.builtin.file:
    src: "{{ redelk_server_compose_file }}"
    dest: "{{ redelk_server_path }}/docker-compose.yml"
    state: link
    force: true

- name: Set vm.max_map_count at runtime
  become: true
  ansible.builtin.command: "sysctl -w vm.max_map_count={{ redelk_vm_max_map_count }}"
  changed_when: false

- name: Persist vm.max_map_count for Elasticsearch
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^vm\\.max_map_count='
    line: "vm.max_map_count={{ redelk_vm_max_map_count }}"
    create: true

- name: Check for existing self-signed certificate
  ansible.builtin.stat:
    path: >-
      {{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/fullchain.pem
  register: redelk_server_self_signed_cert
  when: not redelk_letsencrypt_enabled | bool

- name: Ensure self-signed certificate directory exists
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  when: not redelk_letsencrypt_enabled | bool

- name: Create self-signed certificate for nginx
  become: true
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -nodes -newkey rsa:4096 -days 365
      -keyout {{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/privkey.pem
      -out {{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/fullchain.pem
      -subj /CN={{ redelk_external_domain | default(redelk_self_signed_cert_dirname, true) }}
  args:
    creates: >-
      {{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/fullchain.pem
  when: not redelk_letsencrypt_enabled | bool

- name: Check for existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}/fullchain.pem"
  register: redelk_server_letsencrypt_cert
  when: redelk_letsencrypt_enabled | bool

- name: Bootstrap Let's Encrypt certificate
  become: true
  ansible.builtin.command:
    cmd: "./init-letsencrypt.sh {{ redelk_server_compose_file }} {{ redelk_external_domain }}"
  args:
    chdir: "{{ redelk_server_path }}"
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Start or update RedELK stack
  become: true
  ansible.builtin.shell: |
    if command -v docker-compose >/dev/null 2>&1; then
      docker-compose -f docker-compose.yml up --build -d
    else
      docker compose -f docker-compose.yml up --build -d
    fi
  args:
    chdir: "{{ redelk_server_path }}"
  register: redelk_server_compose_up
  changed_when: >-
    'Creating' in redelk_server_compose_up.stdout or
    'Recreating' in redelk_server_compose_up.stdout or
    'Starting' in redelk_server_compose_up.stdout or
    'Building' in redelk_server_compose_up.stdout
  when: redelk_start_containers | bool

- name: Create deployment marker
  ansible.builtin.copy:
    content: ""
    dest: "{{ redelk_server_path }}/.ansible_redelk_installed"
    mode: "0600"
    force: false

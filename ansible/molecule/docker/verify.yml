---
- name: Verify Docker role
  hosts: docker_hosts
  gather_facts: false
  tasks:
    - name: Check docker reports version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Assert docker version output is present
      ansible.builtin.assert:
        that:
          - "'Docker version' in docker_version.stdout"
        quiet: true

    # redelkctl refuses to install without Compose v2, so the plugin matters as much as the engine.
    - name: Check docker compose is the v2 plugin
      ansible.builtin.command: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Assert docker compose v2 is available
      ansible.builtin.assert:
        that:
          - "'Docker Compose version' in docker_compose_version.stdout"
        quiet: true

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert docker service is active
      ansible.builtin.assert:
        that:
          - "'docker.service' in ansible_facts.services"
          - ansible_facts.services['docker.service'].state == 'running'
        quiet: true

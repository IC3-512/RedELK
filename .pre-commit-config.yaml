# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install with:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # The filebeat configs are templates with placeholders, not valid YAML on their own.
        exclude: ^(c2servers|redirs)/filebeat(/inputs\.d)?/.*\.yml$
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # Big enough for the Kibana saved-object exports, small enough to catch a stray archive.
        args: [--maxkb=1024]
      - id: requirements-txt-fixer
      # RedELK generates a CA and per-host keys. None of it may ever reach the repository.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Keep these arguments identical to RUFF_SELECT and RUFF_LINE_LENGTH
      # in .github/workflows/python.yml.
      - id: ruff-check
        args: [--select, "E4,E7,E9,F,I", --fix]
      - id: ruff-format
        args: [--line-length, "100"]

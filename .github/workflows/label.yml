name: Label PR

# pull_request_target is required so pull requests from forks get a token that may write labels.
# It is safe here only because this workflow never checks out or executes the head ref.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Labels are also set by hand during triage; only add, never take away.
          sync-labels: false

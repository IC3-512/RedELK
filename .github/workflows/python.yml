name: Python

on:
  push:
    branches:
      - master
      - develop
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ruff is configured on the command line because the repository carries no ruff.toml yet.
  # Keep these two lines identical to the ruff hook arguments in .pre-commit-config.yaml.
  RUFF_SELECT: E4,E7,E9,F,I
  RUFF_LINE_LENGTH: "100"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.1"

      # Everything RedELK ships Python for: redelkctl and the daemon that runs in redelk-base.
      - name: Lint
        run: |
          ruff check --select "${RUFF_SELECT}" --output-format=github \
            tools elkserver/docker/redelk-base/redelkinstalldata/scripts

      - name: Format
        run: |
          ruff format --check --diff --line-length "${RUFF_LINE_LENGTH}" \
            tools elkserver/docker/redelk-base/redelkinstalldata/scripts

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r tools/requirements.txt
          python -m pip install --disable-pip-version-check \
            -r elkserver/docker/redelk-base/redelkinstalldata/scripts/requirements.txt

      # The suite is being written alongside this workflow. Absence is tolerated; a present suite
      # that fails is not.
      - name: Look for a test suite
        id: suite
        run: |
          if [ -d tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No tests::tests/ does not exist yet, nothing to run"
          fi

      - name: Run pytest
        if: steps.suite.outputs.present == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: python -m pytest tests -q

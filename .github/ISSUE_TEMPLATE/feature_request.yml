name: Feature request
description: Suggest a capability, a C2 integration or an enrichment module
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the operational situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like RedELK to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you already tried or considered

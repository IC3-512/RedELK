# Part of RedELK
#
# In this file we configure the logstash filtes for Stage 1 teamserver logs
#
# Author: Outflank B.V. / Marc Smeets
#
# Note: there used to be a branch for [c2][log][type] == "events", reading Stage1's server-level
# main.log. Stage1 v2 no longer writes that file and no Filebeat input has shipped it for several
# releases, so the branch was unreachable and has been removed. If a future Stage1 brings it back,
# add the input first and reinstate the branch alongside it.


filter {
  if [infra][log][type] == "rtops" and [c2][program] == "stage1" {

    # Filebeat's add_host_metadata processor stamps the TEAMSERVER's identity onto every line it
    # ships: host.name, host.hostname, host.id, host.architecture and the whole host.os tree. On a
    # C2 log that is wrong twice over - the event happened on the target, and the target's details
    # are parsed out of the message below.
    #
    # This used to be guarded by `if [agent][name] == [host][name]`, which assumes Filebeat's
    # agent.name is the machine's hostname. A deployment that names its agents after their role
    # never satisfies it: agent.name "outflank-init" on a host called "ip-10-0-1-84". Measured on
    # such a deployment, 15 of 17 rtops documents carried host.name of the C2 server and the 2 INIT
    # lines - the only ones the grok below rewrites - carried the target, so one implant's activity
    # split across two hosts and no dashboard grouping by host could be right.
    #
    # host.os was worse than wrong, it was mixed: the grok overwrites os.name, os.version and
    # os.kernel but not os.family, os.platform, os.codename or os.type, so a Windows 11 implant was
    # stored as name "Windows" with family "debian", codename "bookworm" and type "linux". A search
    # for host.os.type:windows found nothing while host.os.name:Windows found it.
    #
    # Removing it unconditionally is the only version that cannot be defeated by how an agent is
    # named, and it is what makes enrich_stage1 work: that module merges the initial implant line's
    # host onto every later line but deliberately lets the destination win a conflict, so as long
    # as Filebeat's value sits there, the implant's real host can never land.
    mutate {
      remove_field => [
        "[host][name]", "[host][hostname]", "[host][id]", "[host][architecture]",
        "[host][containerized]", "[host][mac]", "[host][ip]", "[host][os]"
      ]
    }

    # Rules for 'implant' logs
    if [c2][log][type] == "implant" {
      # Get the timestamp from the log line, and get the rest of the log line.
      #
      # The "*** " separator is optional: Stage1 does not write it on every line. Seen on
      # "2026-08-14 21:28:03 UTC Unknown download for task 5U3ZHILKF3", which is a perfectly good
      # log line that this grok rejected outright - so it reached Elasticsearch with no
      # c2.timestamp, no c2.message and a _grokparsefailure, instead of being parsed as far as it
      # goes. Requiring a separator the source does not always emit turns a partial parse into no
      # parse at all.
      grok {
        match => { "message" => "(?<[c2][timestamp]>%{YEAR}\-%{MONTHNUM}\-%{MONTHDAY} %{HOUR}\:%{MINUTE}\:%{SECOND}) UTC (\*\*\* )?(?<[c2][message]>[\s\S]*)" }
      }
      # Set the timestamp from the log to @timestamp.
      # yyyy and not YYYY: capital YYYY is the ISO week-year, which lands the days around New Year
      # in the wrong year.
      date {
        match => [ "[c2][timestamp]", "yyyy-MM-dd HH:mm:ss" ]
        target => "@timestamp"
        timezone => "Etc/UTC"
      }

      # matching lines with 'INIT' = new implants
      if "INIT " in [c2][message] {
        mutate {
          replace  => { "[c2][log][type]" => "implant_newimplant" }
        }

        # new implant - Starts with INIT or CLIENT_NEW_UID
        # matching lines like: INIT stage1Uid:I9TADD99; targetHostname:DESKTOP-MGEG30S; targetUsername:CONTOSO\ieuser; targetOs:Windows 10.0 (OS Build 17763); targetPid:456; targetProcname:Stage1-Syscall_x64_Release.exe; targetArch:64; stage1Killdate:2020-06-06 12:59:40; targetIp:10.10.201.31; transportIp:192.168.96.6;
        # overwrite is required for host.* because Filebeat's add_host_metadata processor already
        # filled host.name and host.os.* with the *teamserver's* details.
        grok {
          match => { "[c2][message]" => "(INIT|CLIENT_NEW_UID) stage1Uid\:(?<[implant][id]>([^;]*)); targetHostname\:(?<[host][name]>([^;]*)); targetUsername\:(?<[user][name]>([^;]*)); targetOs:%{NOTSPACE:[host][os][name]}(?:(%{SPACE}%{NOTSPACE:[host][os][version]} \(OS Build %{NOTSPACE:[host][os][kernel]}\)))?; targetPid:(?<[process][pid]>([^\;]*)); targetProcname:(?<[process][name]>([^\;]*)); targetArch:(?<[implant][arch]>([^\;]*)); stage1Killdate:(?<[implant][kill_date]>([^\;]*)); targetIp:%{IPORHOST:[host][ip_int]}; transportIp:%{IPORHOST:[host][ip_ext]};"}
          overwrite => [ "[host][name]", "[user][name]", "[host][os][name]", "[host][os][version]", "[host][os][kernel]", "[process][name]", "[process][pid]" ]
        }

        # host.os.type is removed above with the rest of Filebeat's teamserver metadata, and the
        # grok cannot fill it because Stage1 reports a product name ("Windows 11.0 (OS Build
        # 26100)"), not an ECS os type. Derive it, or the field an ECS query reaches for first is
        # simply absent on every implant.
        if [host][os][name] =~ /(?i)windows/ {
          mutate { add_field => { "[host][os][type]" => "windows" } }
        } else if [host][os][name] =~ /(?i)(linux|debian|ubuntu|centos|red ?hat|fedora)/ {
          mutate { add_field => { "[host][os][type]" => "linux" } }
        } else if [host][os][name] =~ /(?i)(mac ?os|darwin|os ?x)/ {
          mutate { add_field => { "[host][os][type]" => "macos" } }
        }

        # implant.kill_date is mapped as a date. Stage1 writes "2020-06-06 12:59:40", which
        # Elasticsearch's default date format rejects - and a rejected field rejects the whole
        # document - so normalise it to ISO8601 here.
        if [implant][kill_date] {
          date {
            match => [ "[implant][kill_date]", "yyyy-MM-dd HH:mm:ss" ]
            target => "[implant][kill_date]"
            timezone => "Etc/UTC"
            tag_on_failure => [ "_dateparsefailure_killdate" ]
          }
        }

        # Now duplicate fields host.ip_int and host.ip_ext to host.ip to adhere to ECS.
        if [host][ip_int] {
	        mutate {
           add_field  => { "[host][ip]" => "%{[host][ip_int]}" }
	        }
        }
        if [host][ip_ext] {
          mutate {
            add_field => {
              "[host][domain_ext]" => "%{[host][ip_ext]}"
              "[host][ip]" => "%{[host][ip_ext]}"
            }
          }
          # do reverse DNS lookup
          dns {
            reverse => ["[host][domain_ext]"]
            action => "replace"
            timeout => "2.0"
          }
          # add geo ip info from City DB
          geoip {
            source => "[host][ip_ext]"
            target => "[host]"
            add_tag => "geoip_host_city"
          }
          # add geo ip info from ASN DB
          geoip {
            source => "[host][ip_ext]"
            target => "[host]"
            default_database_type => "ASN"
            add_tag => "geoip_host_asn"
          }
        }

        # now duplicate this specific log line, remove some irrelevant fields and make it ready to store in the ImplantsDB index (different output)
        # event.action is set here because the clone loses c2.log.type; the generic block at the
        # bottom of this file would otherwise write the literal string "%{[c2][log][type]}".
        clone {
          clones => [ "implantsdb" ]
          remove_field => [ "[c2][log][type]","[c2][message]","[infra][log][type]" ]
          add_field => { "[event][action]" => "implant_newimplant" }
        }
      }

      # matching lines with 'TASKDISTRIBUTED' = task sent to an implant
      if "TASKDISTRIBUTED " in [c2][message] {
        mutate {
          replace  => { "[c2][log][type]" => "implant_task" }
        }

        # matching lines like: TASKDISTRIBUTED stage1Uid:ZPO0VW0W; taskUid:LDCG4JL38W; taskRequest:getpersistkey; taskRequestparameters:OneDrive;
        grok {
          match => { "[c2][message]" => "TASKDISTRIBUTED stage1Uid\:(?<[implant][id]>([^;]*)); taskUid\:(?<[implant][task_id]>([^;]*)); (taskOperator\:(?<[c2][operator]>([^;]*)); )?taskRequest\:(?<[implant][task]>([^;]*)); taskRequestparameters\:(?<[implant][task_parameters]>([^;]*));"}
        }
      }

      # matching lines with 'TASKRESPONSE' = result of a task
      if "TASKRESPONSE " in [c2][message] {
        mutate {
          replace  => { "[c2][log][type]" => "implant_output" }
        }

        # matching lines like: TASKRESPONSE stage1Uid:LA1JSTG3; taskUid:ITXHK99Z19; taskRequest:pwd; taskRequestparameters:; taskResponse:C:\Users\ieuser\Desktop;
        #
        # The output capture deliberately does not require the trailing ';' any more, and is a
        # character class rather than the (.|\r|\n)* alternation. Both changes exist for the same
        # failure: when a task's output was truncated the terminator went with it, and a greedy
        # multi-line group followed by a literal ';' then backtracked across the entire body
        # looking for one that was not there. The event came out tagged _groktimeout with every
        # field unset - not just the output, but implant.id, task, task_id and operator too, because
        # a grok that times out sets nothing at all. Two of seventeen documents on a real
        # engagement were lost that way, and they were the two largest outputs.
        #
        # With nothing after the greedy group there is no literal to hunt for and no backtracking,
        # so a truncated line now degrades to "the output we received" instead of to nothing. The
        # mutate below takes the ';' back off when it is present.
        grok {
          match => { "[c2][message]" => "TASKRESPONSE stage1Uid\:(?<[implant][id]>([^;]*)); taskUid\:(?<[implant][task_id]>([^;]*)); (taskOperator\:(?<[c2][operator]>([^;]*)); )?taskRequest\:(?<[implant][task]>([^;]*)); taskRequestparameters\:(?<[implant][task_parameters]>([^;]*)); taskResponse\:(?<[implant][output]>[\s\S]*)"}
        }

        if [implant][output] {
          mutate {
            gsub => [ "[implant][output]", ";[\s]*$", "" ]
          }
        }

        # Check if there was a file downloaded. Test the parsed implant.output, not the raw
        # message: the grok above captures taskResponse with no space after the colon, so the
        # old '"taskResponse: Downloaded " in [c2][message]' test never fired and the download
        # records were never created.
        # "Downloaded " followed by anything that is not "[". A successful download reports the
        # path it saved; a failed one reports the error in brackets instead -
        #   Downloaded [Error 3] Das System kann den angegebenen Pfad nicht finden. 0 b [u'...
        # which matched the old test all the same, so a download that never happened was cloned
        # into a downloads record and then failed the grok below, having no path, no size and no
        # local id to find. Seen on a real engagement: one mistyped filename produced a bogus
        # download document and a _grokparsefailure.
        if [implant][output] =~ /\A\s*Downloaded [^\[]/ {
          clone {
            clones => [ "downloads" ]
          }

          # The clone marker is a tag under ecs_compatibility v1 and the [type] field when ECS is
          # disabled. Matching only [type] meant this block never ran, so the clone went into
          # rtops as a byte-for-byte duplicate of the implant_output line it came from.
          if [type] == "downloads" or "downloads" in [tags] {
            # clean up the fields - remove type and c2logtype, and add c2logtype as downloads
            mutate {
              remove_field => ["type", "[c2][log][type]"]
              remove_tag => ["downloads"]
            }
            mutate {
              add_field => { "[c2][log][type]" => "downloads" }
            }

            # Matching lines like: Downloaded C:\Users\ieuser.CONTOSO\Desktop\Stage1-Syscall_x64_Release.exe 305 kb [1592230528_125IJU9I] Stage1-Syscall_x64_Release.exe;
            grok {
              match => { "[implant][output]" => "\A\s*Downloaded %{PATH:[file][directory]}\\(?<[file][name]>([^\;]*)) %{INT} (kb|mb|b|gb) \[(?<[file][directory_local]>([^\]]*))] %{GREEDYDATA}" }
            }

            # Add path/URI value to the downloaded file
            ruby {
              path => "/usr/share/logstash/redelk-main/scripts/outflankstage1_makedownloadspath.rb"
            }
          }
        }
      }

      # Add path/URI value to the full implant.log file
      ruby {
        path => "/usr/share/logstash/redelk-main/scripts/outflankstage1_makelogpath.rb"
      }

      # Outflank records no ATT&CK data of its own - unlike Cobalt Strike, which writes the
      # techniques into the beacon log for 51-filter-c2-cobaltstrike to parse - so derive them from
      # the task name. Without this, threat.technique.id is never set on an Outflank engagement,
      # enrich_ttp has nothing to resolve (it only ever enriches ids that already exist) and the
      # ATT&CK Navigator layer it exports comes out empty.
      #
      # Placed after both the TASKDISTRIBUTED and the TASKRESPONSE grok, so a task carries its
      # techniques when it is issued and again when it answers.
      ruby {
        path => "/usr/share/logstash/redelk-main/scripts/outflankstage1_task_to_ttp.rb"
      }

      # The same script Cobalt Strike uses, so threat.technique.reference has one shape whichever
      # C2 the document came from.
      if [threat][technique][id] {
        ruby {
          path => "/usr/share/logstash/redelk-main/scripts/mitre_make_technique_references.rb"
        }
      }

    }

    # Add metadata for SIEM
    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][category]" => "host"
        "[event][module]" => "redelk"
        "[event][dataset]" => "c2"
      }
    }
    # The implantsdb clone has no c2.log.type left and already carries its own event.action.
    # Without this guard sprintf leaves the literal "%{[c2][log][type]}" in the document.
    if [c2][log][type] {
      mutate {
        add_field => { "[event][action]" => "%{[c2][log][type]}" }
        copy => { "[c2][log][type]" => "[event][type]" }
      }
    }
  }
}

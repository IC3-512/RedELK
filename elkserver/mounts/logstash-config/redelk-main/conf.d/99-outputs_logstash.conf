# Part of RedELK
#
# In this file we configure the logstash outputs
#
# Author: Outflank B.V. / Marc Smeets
#
# Notes on index naming and lifecycle:
#   - %{+yyyy.MM.dd} and not %{+YYYY.MM.dd}: capital YYYY is the ISO week-year in Java's date
#     formatter, so around New Year it writes documents into the wrong year's index.
#   - manage_template => false and ilm_enabled => false: redelk-base bootstraps the composable
#     index templates and the ILM policy, and attaches the policy through index.lifecycle.name.
#     Letting the output manage either would overwrite that.
#   - data_stream => false: RedELK's enrichment and alarm modules update documents in place,
#     which data streams do not allow.

output {
  if [infra][log][type] == "rtops" {
    elasticsearch {
      hosts => ["https://redelk-elasticsearch:9200"]
      sniffing => false
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "rtops-%{+yyyy.MM.dd}"
      user => "redelk_ingest"
      password => "${CREDS_redelk_ingest}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${CERTS_LOGSTASH_OUTPUT_CA}"]
      ssl_verification_mode => "full"
    }
  }

  # The clone filter marks its clones with a tag under ecs_compatibility v1 and with the root
  # [type] field when ECS is disabled. Match both so routing survives either setting, and so
  # the roguedomaincheck file input (which sets [type] directly) keeps working.
  if ([type] == "implantsdb" or "implantsdb" in [tags]) {
    elasticsearch {
      hosts => ["https://redelk-elasticsearch:9200"]
      sniffing => false
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "implantsdb"
      user => "redelk_ingest"
      password => "${CREDS_redelk_ingest}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${CERTS_LOGSTASH_OUTPUT_CA}"]
      ssl_verification_mode => "full"
    }
  }

  if [infra][log][type] == "redirtraffic" {
    elasticsearch {
      hosts => ["https://redelk-elasticsearch:9200"]
      sniffing => false
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "redirtraffic-%{+yyyy.MM.dd}"
      user => "redelk_ingest"
      password => "${CREDS_redelk_ingest}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${CERTS_LOGSTASH_OUTPUT_CA}"]
      ssl_verification_mode => "full"
    }
  }

  if [c2][log][type] == "credentials" {
    elasticsearch {
      hosts => ["https://redelk-elasticsearch:9200"]
      sniffing => false
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "credentials-%{+yyyy.MM.dd}"
      user => "redelk_ingest"
      password => "${CREDS_redelk_ingest}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${CERTS_LOGSTASH_OUTPUT_CA}"]
      ssl_verification_mode => "full"
    }
  }

  if ([type] == "bluecheck" or "bluecheck" in [tags]) {
    elasticsearch {
      hosts => ["https://redelk-elasticsearch:9200"]
      sniffing => false
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "bluecheck-%{+yyyy.MM.dd}"
      user => "redelk_ingest"
      password => "${CREDS_redelk_ingest}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${CERTS_LOGSTASH_OUTPUT_CA}"]
      ssl_verification_mode => "full"
    }
  }

  if [infra][log][type] == "email" {
    elasticsearch {
      hosts => ["https://redelk-elasticsearch:9200"]
      sniffing => false
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "email-%{+yyyy.MM.dd}"
      user => "redelk_ingest"
      password => "${CREDS_redelk_ingest}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${CERTS_LOGSTASH_OUTPUT_CA}"]
      ssl_verification_mode => "full"
    }
  }
}

# Part of RedELK
#
# In this file we configure the logstash filters for Sliver logs
#
# Author: hypnoticpattern
#

filter {
  if [infra][log][type] == "rtops" and [c2][program] == "sliver" {
    if [c2][log][type] == "events" {

      # The audit log is newline delimited JSON in which the actual RPC record is itself a JSON
      # string in `msg`. Session lifecycle lines instead carry plain text in `msg` plus a
      # top-level Session object, so a parse failure here is expected and must not drop the line.
      json {
        source => "[msg]"
        tag_on_failure => [ "_sliver_msg_not_json" ]
      }

      mutate {
        rename => { "[level]" => "[log][level]" }
      }

      date {
        match => [ "[time]", "ISO8601" ]
        target => "@timestamp"
        timezone => "Etc/UTC"
      }

      mutate {
        copy => { "@timestamp" => "[c2][timestamp]" }
        remove_field => [ "time" ]
      }

      mutate {
        rename   => { "[msg]" => "[c2][message]" }
      }

      if [method] {
        mutate {
          replace => { "[c2][log][type]" => "c2_command" }
          gsub => [ "[method]", "^/rpcpb\.SliverRPC/", "" ]
        }
      }

      mutate {
        rename  => { "[method]" => "[c2][command][name]" }
        rename  => { "[request]" => "[c2][command][arguments]" }
        rename  => { "[session]" => "[c2][implant]" }
      }

      # The Sliver console polls these three RPCs continuously; they carry no operator activity.
      # This tests the parsed method and no longer a substring of the raw message: [msg] embeds
      # operator and target controlled text, so naming a file "GetSessions" used to be enough to
      # make the surrounding operator activity vanish from RedELK.
      if [c2][command][name] in [ "GetSessions", "GetBeacons", "GetVersion" ] {
        drop { }
      }

      # Upload carries the entire file as base64 inside the request, which would grow every rtops
      # document by the size of the uploaded payload. Blank the value instead of deleting the
      # key: dropping "Data":"..." plus its trailing comma only produces valid JSON when Data is
      # not the last key, and the parse below has to keep working either way.
      if [c2][command][name] == "Upload" {
        mutate {
          gsub => [ "[c2][command][arguments]", '("Data"\s*:\s*")[A-Za-z0-9+/]*={0,2}(")', '\1\2' ]
        }
      }

      # c2.command.arguments and c2.implant are unbounded operator and target controlled JSON.
      # They are parsed so the fields below can be lifted out of them, and the rtops index
      # template maps both as `flattened` so no set of exotic keys can explode the mapping.
      json {
        source => "[c2][command][arguments]"
        target => "[c2][command][arguments]"
        tag_on_failure => [ "_sliver_arguments_not_json" ]
      }

      json {
        source => "[c2][implant]"
        target => "[c2][implant]"
        tag_on_failure => [ "_sliver_implant_not_json" ]
      }

      if [c2][command][arguments][Request][SessionID] {
        mutate {
          rename  => { "[c2][command][arguments][Request][SessionID]" => "[implant][id]" }
        }
      }

      # copy and not add_field: Filebeat's add_host_metadata already filled host.name with the
      # *teamserver's* hostname, and add_field would turn it into a two-element array.
      if [c2][implant][Hostname] {
        mutate {
          copy  => { "[c2][implant][Hostname]" => "[host][name]" }
        }
      }

      if [c2][implant][Username] {
        mutate {
          copy  => { "[c2][implant][Username]" => "[user][name]" }
        }
      }

      if [c2][command][name] == "LootAdd" and [c2][command][arguments][Credential] {
        mutate {
          replace => { "[c2][log][type]" => "credentials"}
        }

        # Sliver's clientpb CredentialType is USER_PASSWORD = 1 and API_KEY = 2. Both branches
        # used to test '== 1', so an API key silently overwrote the user/password parsed just
        # above. Key on which credential field is actually populated instead: the audit log is
        # written with Go's encoding/json, which drops the enum entirely when it is zero and
        # gives no guarantee it keeps being serialised as a number.
        if [c2][command][arguments][Credential][APIKey] {
          # the loot Name is the only human readable handle an API key has
          mutate {
            copy => { "[c2][command][arguments][Name]" => "[creds][username]"}
            copy => { "[c2][command][arguments][Credential][APIKey]" => "[creds][credential]"}
          }
        } else if [c2][command][arguments][Credential][User] or [c2][command][arguments][Credential][Password] {
          mutate {
            copy => { "[c2][command][arguments][Credential][User]" => "[creds][username]" }
            copy => { "[c2][command][arguments][Credential][Password]" => "[creds][credential]"}
          }
        }
      }

      # Handle new Sliver session
      if [log][level] == "warning" and [Session] {

        grok {
          match => { "[Session][RemoteAddress]" => "%{IP:[host][ip_ext]}:%{POSINT}"}
        }

        if [Session][ActiveC2] {
          mutate {
            convert => { "[Session][ActiveC2]" => "string" }
          }
        }

        mutate {
          replace  => { "[c2][log][type]" => "implant_newsession" }
          rename  => { "[Session][OS]" => "[host][os][family]" }
          rename  => { "[Session][Hostname]" => "[host][name]" }
          rename  => { "[Session][ID]" => "[implant][id]" }
          rename  => { "[Session][LastCheckin]" => "[implant][checkin]" }
          rename  => { "[Session][Name]" => "[implant][name]" }
          rename  => { "[Session][Username]" => "[user][name]" }
          rename  => { "[Session][PID]" => "[process][pid]" }
          rename  => { "[Session][Filename]" => "[process][name]" }
          rename  => { "[Session][Transport]" => "[c2][listener][type]" }
          rename  => { "[Session][ActiveC2]" => "[implant][url]" }
        }

        date {
          match => [ "[implant][checkin]", "UNIX" ]
          target => "[implant][checkin]"
          timezone => "Etc/UTC"
        }

        # Whatever is left of the Session object is target controlled JSON. Park it in the
        # flattened c2.implant field rather than letting it create root level mappings.
        mutate {
          rename => { "[Session]" => "[c2][implant]" }
        }

        if [host][ip_ext] {
          mutate {
            add_field => { "[host][domain_ext]" => "%{[host][ip_ext]}" }
            copy => { "[host][ip_ext]" => "[host][ip]" }
          }
          # do reverse DNS lookup
          dns {
            reverse => ["[host][domain_ext]"]
            action => "replace"
            timeout => "2.0"
          }
          # add geo ip info from City DB
          geoip {
            source => "[host][ip_ext]"
            target => "[host]"
            add_tag => "geoip_host_city"
          }
          # add geo ip info from ASN DB
          geoip {
            source => "[host][ip_ext]"
            target => "[host]"
            default_database_type => "ASN"
            add_tag => "geoip_host_asn"
          }
        }

        # Sliver never produced an implantsdb document, so no Sliver implant showed up in the
        # implant overview. Mirror what the Cobalt Strike and Stage1 filters do.
        # event.action is set here because the clone loses c2.log.type.
        clone {
          clones => [ "implantsdb" ]
          remove_field => [ "[c2][log][type]","[c2][message]","[infra][log][type]" ]
          add_field => { "[event][action]" => "implant_newsession" }
        }
      }
    }

    # Add metadata for SIEM
    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][category]" => "host"
        "[event][module]" => "redelk"
        "[event][dataset]" => "c2"
      }
    }
    # The implantsdb clone has no c2.log.type left and already carries its own event.action.
    # Without this guard sprintf leaves the literal "%{[c2][log][type]}" in the document.
    if [c2][log][type] {
      mutate {
        add_field => { "[event][action]" => "%{[c2][log][type]}" }
        copy => { "[c2][log][type]" => "[event][type]" }
      }
    }
  }
}

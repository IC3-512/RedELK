# Part of RedELK
#
# In this file we configure the logstash filters for Apache logs
#
# Author: Outflank B.V. / Marc Smeets
# Contributor: Lorenzo Bernardi
#

filter {
  if [infra][log][type] == "redirtraffic" and [redir][program] == "apache" {

    # Filebeat introduces the source field for the name of the log file path. But this collides with source object from the Elastic Common Schema.
    # We have no need for the filebeat's field as its also stored in log.file.path. So we drop it.
    mutate {
      remove_field => [ "source" ]
    }

    # Let's first trim the syslog-like info from the log line.
    # overwrite is required: Filebeat already set host.name from the shipper, and without it
    # grok appends its capture and host.name becomes a two-element array.
    grok {
      match => { "message" => [ "^\[%{HTTPDATE:[redir][timestamp]}\] (%{NOTSPACE:[host][name]}|-) %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]}\]): %{GREEDYDATA:messagenosyslog}" ] }
      overwrite => [ "[host][name]" ]
    }

    # Now matching the real Apache log lines. There are several formats:
    # - Lines without X-Forwarded-For, logged as "xforwardedfor:-"
    # - Lines with X-Forwarded-For set
    # - Cut-off lines, when the log line is larger than the redirector's log buffer size
    # Grok tries the patterns in order and stops at the first that matches, so the format a line
    # has decides itself from the parse. The previous substring tests ran against the raw
    # [message], which contains the client supplied User-Agent and request line - a visitor could
    # steer its own request into the wrong branch simply by sending the right header.
    grok {
      match => { "messagenosyslog" => [
        "^frontend:(?<[redir][frontend][name]>([^/]*))/%{IPORHOST:[redir][frontend][ip]}:%{POSINT:[redir][frontend][port]} backend:%{NOTSPACE:[redir][backend][name]} client:%{IPORHOST:[source][ip]}:%{POSINT:[source][port]} xforwardedfor:- headers:\{(?<[http][headers][all]>([^\}]*))} statuscode:%{INT:[http][response][status_code]} request:%{GREEDYDATA:[http][request][body][content]}",
        "^frontend:(?<[redir][frontend][name]>([^/]*))/%{IPORHOST:[redir][frontend][ip]}:%{POSINT:[redir][frontend][port]} backend:%{NOTSPACE:[redir][backend][name]} client:%{IPORHOST:[source][cdn][ip]}:%{POSINT:[source][cdn][port]} xforwardedfor:%{IPORHOST:[redir][xforwardedfor]}(?:, )?(?:%{GREEDYDATA:[source][ip_otherproxies]}) headers:\{(?<[http][headers][all]>([^\}]*))} statuscode:%{INT:[http][response][status_code]} request:%{GREEDYDATA:[http][request][body][content]}",
        "^frontend:(?<[redir][frontend][name]>([^/]*))/%{IPORHOST:[redir][frontend][ip]}:%{POSINT:[redir][frontend][port]} backend:%{NOTSPACE:[redir][backend][name]} %{GREEDYDATA:[redir][catchall]}"
      ] }
      tag_on_failure => [ "redirtraffic_no_traffic_match" ]
    }

    if [redir][catchall] {
      mutate {
        add_tag => [ "redirlongmessagecatchall" ]
      }
    }

    if [redir][xforwardedfor] {
      mutate {
        add_tag => [ "redirtrafficxforwardedfor" ]
      }
      # X-Forwarded-For is fully client controlled while source.ip is mapped as type `ip`: a
      # hostname or any other junk in there makes Elasticsearch reject the whole document, so a
      # single crafted header would erase a request from RedELK. Only promote the value once it
      # really parses as an address; the raw header is kept in http.headers.x_forwarded_for.
      grok {
        match => { "[redir][xforwardedfor]" => [ "^%{IP:[source][ip]}$" ] }
        tag_on_failure => [ "redirtraffic_xforwardedfor_invalid" ]
      }
      mutate {
        remove_field => [ "[redir][xforwardedfor]" ]
      }
    }

    # remove field [source][ip_otherproxies] if empty
    if [source][ip_otherproxies] and [source][ip_otherproxies] == "" {
      mutate {
        remove_field => [ "[source][ip_otherproxies]" ]
      }
    }

    if [messagenosyslog] {
      mutate {
        remove_field => [ "messagenosyslog" ]
      }
    }

    # map header values onto dedicated fields and split the values of the headersall field into an array
    if [http][headers][all] {
      # map to dedicated fields
      grok {
        match => { "[http][headers][all]" => [ "(?<[http][headers][useragent]>([^|]*))\|(?<[http][headers][host]>([^|]*))\|(?<[http][headers][x_forwarded_for]>([^|]*))\|(?<[http][headers][x_forwarded_proto]>([^|]*))\|(?<[http][headers][x_host]>([^|]*))\|(?<[http][headers][forwarded]>([^|]*))\|(?<[http][headers][via]>([^|]*))" ] }
      }

      # split the values into an array
      mutate {
        split => { "[http][headers][all]" => "|" }
      }

      # Add useragent data
      if [http][headers][useragent] {
        useragent {
          source => "[http][headers][useragent]"
        }
      }
    }

    # Set the timestamp from the log to @timestamp, example: 15/Apr/2018:19:22:31 +0000
    date {
      match => [ "[redir][timestamp]", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
      timezone => "Etc/UTC"
    }

    # When IPv6 is enabled on your host, IPV4 addresses can be reported like ::ffff:ipv4address. Here we cut off the ::ffff: part
    if "ffff" in [source][ip] {
      mutate {
        gsub => [
          "[source][ip]", "\:\:ffff\:", ""
        ]
      }
    }
    if "ffff" in [redir][frontend][ip] {
      mutate {
        gsub => [
          "[redir][frontend][ip]", "\:\:ffff\:", ""
        ]
      }
    }
    if "ffff" in [source][cdn][ip] {
      mutate {
        gsub => [
          "[source][cdn][ip]", "\:\:ffff\:", ""
        ]
      }
    }

    # Add data to the destination
    if [redir][frontend][ip] {
      mutate {
        add_field => { "[destination][ip]" => "%{[redir][frontend][ip]}" }
      }
      # add geo ip info from City DB
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
        add_tag => "geoip_dest_city"
      }
      # add geo ip info from ASN DB
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
        default_database_type => "ASN"
        add_tag => "geoip_dest_asn"
      }
    }

    # Add data to the source
    if [source][ip] {
      # duplicate field so we can replace it with reverse DNS lookup
      mutate {
        add_field => { "[source][domain]" => "%{[source][ip]}" }
      }
      # do reverse DNS lookup
      dns {
        reverse => ["[source][domain]"]
        action => "replace"
        timeout => "2.0"
      }
      # add geo ip info from City DB
      geoip {
        source => "[source][ip]"
        target => "[source]"
        add_tag => "geoip_source_city"
      }
      # add geo ip info from ASN DB
      geoip {
        source => "[source][ip]"
        target => "[source]"
        default_database_type => "ASN"
        add_tag => "geoip_source_asn"
      }
    }

    # Add data to source.cdn.ip
    if [source][cdn][ip] {
      # duplicate field so we can replace it with reverse DNS lookup
      mutate {
        add_field => { "[source][cdn][domain]" => "%{[source][cdn][ip]}" }
      }
      # do reverse DNS lookup
      dns {
        reverse => ["[source][cdn][domain]"]
        action => "replace"
        timeout => "2.0"
      }
    }
  }
}

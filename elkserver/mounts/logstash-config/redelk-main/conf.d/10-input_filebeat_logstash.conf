# Part of RedELK
#
# In this file we configure the logstash inputs
#
# Author: Outflank B.V. / Marc Smeets
#

input {
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "${CERTS_LOGSTASH_INPUT_CRT}"
    ssl_key => "${CERTS_LOGSTASH_INPUT_KEY}"
    # Without client certificate verification anyone able to reach port 5044 can forge
    # redirector and C2 records into RedELK. redelkctl writes LOGSTASH_CLIENT_AUTH=required
    # whenever it issued client certificates for the shippers, and "none" only when the
    # operator explicitly opted out.
    ssl_client_authentication => "${LOGSTASH_CLIENT_AUTH:none}"
    ssl_certificate_authorities => ["${CERTS_LOGSTASH_INPUT_CA}"]
    client_inactivity_timeout => 7200
    ssl_handshake_timeout => 30000
  }
}

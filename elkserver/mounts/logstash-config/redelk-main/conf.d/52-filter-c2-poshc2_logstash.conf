# Part of RedELK
#
# In this file we configure the logstash filters for PoshC2 logs
#
# Author: Outflank B.V. / Marc Smeets / @benpturner - Ben Turner
# Contributor: Lorenzo Bernardi
#

filter {
  if [infra][log][type] == "rtops" and [c2][program] == "poshc2" {

    if [c2][log][type] == "events" {

      # One log line is exactly one of the kinds below, so these are chained instead of being
      # independent 'if's - a line matching two of them would otherwise get every grok capture
      # stored twice, as an array.
      if "PID:" in [message] and "Sleep:" in [message] {
        # matching lines like: 1.2.3.4:443 | Time:03/04/2020 06:29:45 | PID:4242 | Sleep:5s | user @ HOST (x64) | URL:/somewhere
        mutate {
          replace  => { "[c2][log][type]" => "implant_newimplant" }
        }

        # host.ip_ext / host.domain_ext and not host.ext_ip / host.ext_domain: every other C2
        # filter uses the former and the dashboards and enrichment modules query on them.
        # overwrite is required because Filebeat's add_host_metadata already filled host.name
        # with the *teamserver's* hostname.
        grok {
          match => { "message" => "%{IPORHOST:[host][ip_ext]}\:%{POSINT:[host][port]}\s+\|\s+Time:%{GREEDYDATA:[c2][timestamp]}\s+\|\s+PID:%{POSINT:[process][pid]}\s+\|\s+Sleep:%{GREEDYDATA:[implant][sleep]}\s+\|\s+%{GREEDYDATA:[user][name]}\s+@\s+%{GREEDYDATA:[host][name]}\s+\(%{GREEDYDATA:[implant][arch]}\)\s+\|\s+URL\:%{GREEDYDATA:[implant][url]}" }
          overwrite => [ "[host][name]", "[user][name]" ]
        }

        if [host][ip_ext] {
          # duplicate field so we can replace it with reverse DNS lookup and add the external IP to [host][ip]
          mutate {
            add_field => { "[host][domain_ext]" => "%{[host][ip_ext]}" }
            copy => { "[host][ip_ext]" => "[host][ip]" }
          }
          # do reverse DNS lookup
          dns {
            reverse => ["[host][domain_ext]"]
            action => "replace"
            timeout => "2.0"
          }
          # add geo ip info from City DB
          geoip {
            source => "[host][ip_ext]"
            target => "[host]"
            add_tag => "geoip_host_city"
          }
          # add geo ip info from ASN DB
          geoip {
            source => "[host][ip_ext]"
            target => "[host]"
            default_database_type => "ASN"
            add_tag => "geoip_host_asn"
          }
        }

        date {
          match => [ "[c2][timestamp]", "dd/MM/yyyy HH:mm:ss" ]
          target => "@timestamp"
          timezone => "Etc/UTC"
        }

        # The field is [infra][log][type]; removing "[infra][log_type]" removed nothing, so every
        # new implant was indexed into rtops twice - once as itself and once as the clone.
        # event.action is set here because the clone loses c2.log.type.
        clone {
          clones => [ "implantsdb" ]
          remove_field => [ "[c2][log][type]","message","[infra][log][type]" ]
          add_field => { "[event][action]" => "implant_newimplant" }
        }

      } else if "Screenshot captured:" in [message] {
        # matching lines like: *** Screenshot captured:
        mutate {
          replace  => { "[c2][log][type]" => "screenshots" }
        }

        grok {
          # Screenshot.full expects and URL, if the full screenshot is saved then the index needs to be updated to accomodate it
          match => { "message" => "Screenshot\s+captured:\s+%{GREEDYDATA:[screenshot][full]}" }
        }

      } else if "Download file" in [message] {
        # matching lines like: *** Download:
        mutate {
          replace  => { "[c2][log][type]" => "downloads" }
        }

        grok {
          match => { "message" => "Download\s+file\s+part\s+%{GREEDYDATA:[file][path]}" }
        }

      } else if "Message from" in [message] or "logged off" in [message] or "logged on" in [message] {
        # matching lines like: *** Messages:
        mutate {
          replace  => { "[c2][log][type]" => "messages" }
        }

        grok {
          match => { "message" => "(0[1-9]|[12]\d|3[01])/(0[1-9]|1[0-2])/[12]\d{3}\s+([0-1][0-9]|[2][0-3]):([0-5][0-9]):([0-5][0-9]):%{GREEDYDATA:[c2][message]}" }
        }
      }

    }

    # Add metadata for SIEM
    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][category]" => "host"
        "[event][module]" => "redelk"
        "[event][dataset]" => "c2"
      }
    }
    # The implantsdb clone has no c2.log.type left and already carries its own event.action.
    # Without this guard sprintf leaves the literal "%{[c2][log][type]}" in the document.
    if [c2][log][type] {
      mutate {
        add_field => { "[event][action]" => "%{[c2][log][type]}" }
        copy => { "[c2][log][type]" => "[event][type]" }
      }
    }
  }
}

# Part of RedELK
#
# In this file we parse the file with the domain classification cheks
#
# Author: Outflank B.V. / Marc Smeets
#
# roguedomaincheck is different from the other bluechecks: the data is read straight off disk by
# the file input in 11-input_localfiles, which sets [type] itself, so there is no clone from an
# rtops event involved. The sectools/sslcert/pwchange/psx blocks live in
# 80-filter-bluecheck_logstash.conf - they used to be repeated verbatim in both files, which made
# every grok run twice and turned each captured field into a two-element array.

filter {
  if [type] == "bluecheck" or "bluecheck" in [tags] {

    if [bluechecktype] == "roguedomaincheck" {
      grok {
        match => { "message" => "(?<bluechecktimestamp>%{YEAR}\/%{MONTHNUM}\/%{MONTHDAY}, %{HOUR}\:%{MINUTE}\:%{SECOND}) Domain\: %{IPORHOST:domain} Source\: %{GREEDYDATA:classifier} Results\: %{GREEDYDATA:results}" }
      }
      # yyyy and not YYYY: capital YYYY is the ISO week-year, which lands the days around New
      # Year in the wrong year.
      date {
        match => [ "bluechecktimestamp", "yyyy/MM/dd, HH:mm:ss" ]
        target => "@timestamp"
        timezone => "Etc/UTC"
      }
      mutate {
        remove_field => [ "host" ]
      }
    }
  }
}

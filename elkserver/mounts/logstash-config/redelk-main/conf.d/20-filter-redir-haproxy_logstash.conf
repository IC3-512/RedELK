# Part of RedELK
#
# In this file we configure the logstash filters for HAproxy logs
#
# Author: Outflank B.V. / Marc Smeets
#

filter {
  if [infra][log][type] == "redirtraffic" and [redir][program] == "haproxy" {

    # Filebeat introduces the source field for the name of the log file path. But this collides with source object from the Elastic Common Schema.
    # We have no need for the filebeat's field as its also stored in log.file.path. So we drop it.
    mutate {
      remove_field => [ "source" ]
    }

    # Let's first trim the syslog info from the log line.
    # overwrite is required: Filebeat already set host.name from the shipper, and without it
    # grok appends its capture and host.name becomes a two-element array.
    grok {
      match => { "message" => ["^%{SYSLOGTIMESTAMP:syslogtimestamp} %{NOTSPACE:[host][name]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:messagenosyslog}"] }
      overwrite => [ "[host][name]" ]
    }

    mutate {
      remove_field => [ "syslogtimestamp" ]
    }

    # Classification below deliberately tests [process][name] and the anchored, syslog-stripped
    # message instead of the raw [message]. [message] carries the client's User-Agent and request
    # line, so anything keying on a substring of it lets a visitor pick its own branch - or drop
    # its own traffic out of RedELK entirely - just by sending the right header.
    if [process][name] == "haproxy-systemd-wrapper" {
      drop { }
    } else if [messagenosyslog] =~ /^\[(\s*(SSL|ALL|TCP)|UNIX|STAT)\]/ {
      # Capability, filter and socket listings that haproxy prints once at startup.
      drop { }
    } else if [messagenosyslog] =~ /^Proxy \S+ (started|stopped)\./ {
      drop { }
    } else if [messagenosyslog] =~ /^\[(EMERG|ALERT|CRIT|ERR|WARNING|NOTICE|INFO|DEBUG)\]/ {
      # Backend up/down transitions and config errors arrive here. These used to be dropped,
      # which hid exactly the event you care about when a redirector backend dies mid-operation.
      grok {
        match => { "[messagenosyslog]" => [ "^\[%{SPACE}(?<[log][level]>[A-Z]+)%{SPACE}\]%{SPACE}%{GREEDYDATA:[redir][catchall]}" ] }
      }
      mutate {
        add_field => {
          "[redir][backend][name]" => "haproxy-status"
          "[event][action]" => "haproxy_status"
        }
      }
    } else {
      # Real haproxy traffic lines. There are several formats:
      # - Lines without X-Forwarded-For, logged as "xforwardedfor:-"
      # - Lines with X-Forwarded-For set
      # - Cut-off lines, when the log line is larger than the redirector's log buffer size
      # Sometimes HAProxy reports lines with 'message repeated X times' inserted after the
      # SYSLOGPROG. Grok tries the patterns below in order and stops at the first that matches,
      # so which format a line is decides itself from the parse instead of from a substring test.
      grok {
        match => { "messagenosyslog" => [
          "^GMT:%{HTTPDATE:[redir][timestamp]} frontend:(?<[redir][frontend][name]>([^/]*))/(([^/]*))/%{IPORHOST:[redir][frontend][ip]}:%{POSINT:[redir][frontend][port]} backend:%{NOTSPACE:[redir][backend][name]} client:%{IPORHOST:[source][ip]}:%{POSINT:[source][port]} xforwardedfor:- headers:\{\|(?<[http][headers][all]>([^\}]*))} statuscode:%{INT:[http][response][status_code]} request:%{GREEDYDATA:[http][request][body][content]}",
          "^GMT:%{HTTPDATE:[redir][timestamp]} frontend:(?<[redir][frontend][name]>([^/]*))/(([^/]*))/%{IPORHOST:[redir][frontend][ip]}:%{POSINT:[redir][frontend][port]} backend:%{NOTSPACE:[redir][backend][name]} client:%{IPORHOST:[source][cdn][ip]}:%{POSINT:[source][cdn][port]} xforwardedfor:%{IPORHOST:[redir][xforwardedfor]}(?:(,\s)*)(?:%{GREEDYDATA:[source][ip_otherproxies]}) headers:\{\|(?<[http][headers][all]>([^\}]*))} statuscode:%{INT:[http][response][status_code]} request:%{GREEDYDATA:[http][request][body][content]}",
          "^GMT:%{HTTPDATE:[redir][timestamp]} frontend:(?<[redir][frontend][name]>([^/]*))/(([^/]*))/%{IPORHOST:[redir][frontend][ip]}:%{POSINT:[redir][frontend][port]} backend:%{NOTSPACE:[redir][backend][name]} %{GREEDYDATA:[redir][catchall]}"
        ] }
        tag_on_failure => [ "redirtraffic_no_traffic_match" ]
      }

      if [redir][catchall] {
        mutate {
          add_tag => [ "redirlongmessagecatchall" ]
        }
      }

      if [redir][xforwardedfor] {
        mutate {
          add_tag => [ "redirtrafficxforwardedfor" ]
        }
        # X-Forwarded-For is fully client controlled while source.ip is mapped as type `ip`:
        # a hostname or any other junk in there makes Elasticsearch reject the whole document,
        # so a single crafted header would erase a request from RedELK. Only promote the value
        # once it really parses as an address; the raw header is kept in
        # http.headers.x_forwarded_for below either way.
        grok {
          match => { "[redir][xforwardedfor]" => [ "^%{IP:[source][ip]}$" ] }
          tag_on_failure => [ "redirtraffic_xforwardedfor_invalid" ]
        }
        mutate {
          remove_field => [ "[redir][xforwardedfor]" ]
        }
      }

      # remove field [source][ip_otherproxies] if empty
      if [source][ip_otherproxies] and [source][ip_otherproxies] == "" {
        mutate {
          remove_field => [ "[source][ip_otherproxies]" ]
        }
      }

      if "redirtraffic_no_traffic_match" in [tags] {
        # haproxy reports TLS level failures without the GMT:/frontend: prefix, e.g.
        # 1.2.3.4:49196 [16/Sep/2018:07:08:21.783] www-https/1: SSL handshake failure
        grok {
          match => { "messagenosyslog" => [ "^%{IPORHOST:[source][ip]}:%{POSINT:[source][port]} \[(?<[redir][timestamp]>%{MONTHDAY}\/%{MONTH}\/%{YEAR}:%{TIME})\] (?<[redir][frontend][name]>([^/]*))%{GREEDYDATA:[http][request][body][content]}" ] }
          tag_on_failure => [ "redirtraffic_unparsed" ]
        }
        if "redirtraffic_unparsed" not in [tags] {
          mutate {
            remove_tag => [ "redirtraffic_no_traffic_match" ]
            add_field => { "[redir][backend][name]" => "ssl-error" }
          }
        }
      }

      # map header values onto dedicated fields and split the values of the headersall field into an array
      if [http][headers][all] {
        # map to dedicated fields
        grok {
          match => { "[http][headers][all]" => [ "(?<[http][headers][useragent]>([^|]*))\|(?<[http][headers][host]>([^|]*))\|(?<[http][headers][x_forwarded_for]>([^|]*))\|(?<[http][headers][x_forwarded_proto]>([^|]*))\|(?<[http][headers][x_host]>([^|]*))\|(?<[http][headers][forwarded]>([^|]*))\|(?<[http][headers][via]>([^|]*))" ] }
        }

        # split the values into an array
        mutate {
          split => { "[http][headers][all]" => "|" }
        }

        # Add useragent data
        if [http][headers][useragent] {
          useragent {
            source => "[http][headers][useragent]"
          }
        }
      }

      # Set the timestamp from the log to @timestamp. Two formats occur:
      # traffic lines "03/Apr/2020:04:29:45 +0000", TLS failures "16/Sep/2018:07:08:21.783".
      date {
        match => [ "[redir][timestamp]", "dd/MMM/yyyy:HH:mm:ss Z", "dd/MMM/yyyy:HH:mm:ss.SSS" ]
        target => "@timestamp"
        timezone => "Etc/UTC"
      }
    }

    if [messagenosyslog] {
      mutate {
        remove_field => [ "messagenosyslog" ]
      }
    }

    # When IPv6 is enabled on your HAProxy host, IPV4 addresses are reported like ::ffff:ipv4address. Here we cut off the ::ffff: part
    if "ffff" in [source][ip] {
      mutate {
        gsub => [
          "[source][ip]", "\:\:ffff\:", ""
        ]
      }
    }
    if "ffff" in [redir][frontend][ip] {
      mutate {
        gsub => [
          "[redir][frontend][ip]", "\:\:ffff\:", ""
        ]
      }
    }
    if "ffff" in [source][cdn][ip] {
      mutate {
        gsub => [
          "[source][cdn][ip]", "\:\:ffff\:", ""
        ]
      }
    }

    # Add data to the destination
    if [redir][frontend][ip] {
      mutate {
        add_field => { "[destination][ip]" => "%{[redir][frontend][ip]}" }
      }
      # add geo ip info from City DB
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
        add_tag => "geoip_dest_city"
      }
      # add geo ip info from ASN DB
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
        default_database_type => "ASN"
        add_tag => "geoip_dest_asn"
      }
    }

    # Add data to the source
    if [source][ip] {
      # duplicate field so we can replace it with reverse DNS lookup
      mutate {
        add_field => { "[source][domain]" => "%{[source][ip]}" }
      }
      # do reverse DNS lookup
      dns {
        reverse => ["[source][domain]"]
        action => "replace"
        timeout => "2.0"
      }
      # add geo ip info from City DB
      geoip {
        source => "[source][ip]"
        target => "[source]"
        add_tag => "geoip_source_city"
      }
      # add geo ip info from ASN DB
      geoip {
        source => "[source][ip]"
        target => "[source]"
        default_database_type => "ASN"
        add_tag => "geoip_source_asn"
      }
    }
    # Add data to source.cdn.ip
    if [source][cdn][ip] {
      # duplicate field so we can replace it with reverse DNS lookup
      mutate {
        add_field => { "[source][cdn][domain]" => "%{[source][cdn][ip]}" }
      }
      # do reverse DNS lookup
      dns {
        reverse => ["[source][cdn][domain]"]
        action => "replace"
        timeout => "2.0"
      }
    }
  }
}

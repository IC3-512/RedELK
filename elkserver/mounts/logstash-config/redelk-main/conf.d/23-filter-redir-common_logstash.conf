# Part of RedELK
#
# In this file we configure the logstash filters shared by every redirector type
#
# Author: Outflank B.V. / Marc Smeets
#
# 20/21/22 each carried a byte-identical copy of the enrichment below, so a fix landed in one
# redirector type and not in the other two. It lives here once instead.
#
# The filename has to keep sorting after 22: Logstash concatenates conf.d in filename order, and
# this block reads fields that 20/21/22 grok out of the log line. Sorted earlier it would enrich
# fields that do not exist yet and every redirtraffic document would quietly lose source.geo,
# source.as and source.domain - nothing errors, the map panels just go empty.
#
# A fourth redirector type therefore cannot be numbered 24: it has to parse before this file, so
# give it a number below 23 and add its [redir][program] to the list in the condition. Miss either
# and its traffic arrives unenriched, which nothing warns about.
#
# Only the enrichment moved. The per-program grok, the X-Forwarded-For promotion and the date
# filter stay where they are: in haproxy they sit inside an else-branch that its status and
# TLS-error lines never enter, and hoisting them would apply them to documents they never saw.

filter {
  if [infra][log][type] == "redirtraffic" and [redir][program] in [ "haproxy", "apache", "nginx" ] {

    # When IPv6 is enabled on your host, IPV4 addresses can be reported like ::ffff:ipv4address. Here we cut off the ::ffff: part
    if "ffff" in [source][ip] {
      mutate {
        gsub => [
          "[source][ip]", "\:\:ffff\:", ""
        ]
      }
    }
    if "ffff" in [redir][frontend][ip] {
      mutate {
        gsub => [
          "[redir][frontend][ip]", "\:\:ffff\:", ""
        ]
      }
    }
    if "ffff" in [source][cdn][ip] {
      mutate {
        gsub => [
          "[source][cdn][ip]", "\:\:ffff\:", ""
        ]
      }
    }

    # Add data to the destination
    if [redir][frontend][ip] {
      mutate {
        add_field => { "[destination][ip]" => "%{[redir][frontend][ip]}" }
      }
      # add geo ip info from City DB
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
        add_tag => "geoip_dest_city"
      }
      # add geo ip info from ASN DB
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
        default_database_type => "ASN"
        add_tag => "geoip_dest_asn"
      }
    }

    # Add data to the source
    if [source][ip] {
      # duplicate field so we can replace it with reverse DNS lookup
      mutate {
        add_field => { "[source][domain]" => "%{[source][ip]}" }
      }
      # do reverse DNS lookup
      dns {
        reverse => ["[source][domain]"]
        action => "replace"
        timeout => "2.0"
      }
      # add geo ip info from City DB
      geoip {
        source => "[source][ip]"
        target => "[source]"
        add_tag => "geoip_source_city"
      }
      # add geo ip info from ASN DB
      geoip {
        source => "[source][ip]"
        target => "[source]"
        default_database_type => "ASN"
        add_tag => "geoip_source_asn"
      }
    }

    # Add data to source.cdn.ip
    if [source][cdn][ip] {
      # duplicate field so we can replace it with reverse DNS lookup
      mutate {
        add_field => { "[source][cdn][domain]" => "%{[source][cdn][ip]}" }
      }
      # do reverse DNS lookup
      dns {
        reverse => ["[source][cdn][domain]"]
        action => "replace"
        timeout => "2.0"
      }
    }
  }
}

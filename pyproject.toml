####################################################################################################
#
#  Tooling configuration for RedELK.
#
#  This file deliberately declares NO [project] or [build-system] table: RedELK is deployed from a
#  git checkout with ./redelkctl, not installed from PyPI, and turning the repository into a
#  package would change how the daemon and the setup tool find their data files.
#
####################################################################################################

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

# `import redelk_setup` has to work without the caller exporting PYTHONPATH. The GitHub workflow
# sets it too, so keep the two in sync if the layout ever changes.
pythonpath = ["tools"]

# -ra shows why things were skipped/xfailed, which matters here: several tests skip when an
# external binary (openssl, git) is missing, and a silent skip looks like a pass. The strict
# flags turn a typo in a marker name or in this file into an error instead of a no-op.
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
# Identical to the arguments in .github/workflows/python.yml and .pre-commit-config.yaml, so that
# running `ruff check` locally reproduces CI. The workflow still passes them explicitly because it
# lints specific directories rather than the whole tree.
line-length = 100
target-version = "py312"

extend-exclude = [
    "build",
    ".redelk-venv",
    # Not RedELK's code: sample payloads, captured logs and vendored config examples.
    "example-data-and-configs",
    "elkserver/mounts",
]

[tool.ruff.lint]
# E4  imports, E7 statement-level mistakes, E9 syntax/IO errors, F pyflakes, I import order.
# Deliberately narrow: a wider selection would require reformatting code that works, and this
# repository has more urgent problems than unsorted keyword arguments.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# redelkctl is imported as a top-level package from tools/, and the test suite imports its own
# conftest for shared fixtures. Without these two, ruff sorts both as third-party.
known-first-party = ["redelk_setup"]
known-local-folder = ["conftest"]

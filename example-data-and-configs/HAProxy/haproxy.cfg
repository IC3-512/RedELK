# Part of RedELK
#
# This is an example configuration file for HAProxy that works with RedELK
#
# Author: Outflank B.V. / Marc Smeets
#
# Put this file in /etc/haproxy/haproxy.cfg and:
#  - replace 192.0.2.10 with the IP address of your C2 server. 192.0.2.0/24 is the
#    RFC5737 documentation range: it does not route, so an unedited copy of this file
#    cannot accidentally send beacon traffic anywhere.
#  - put a certificate in /etc/haproxy/certs/redir.pem. HAProxy wants the full chain and
#    the private key in one file, which Let's Encrypt does not produce, so concatenate:
#    cat /etc/letsencrypt/live/$DOMAIN/fullchain.pem /etc/letsencrypt/live/$DOMAIN/privkey.pem > /etc/haproxy/certs/redir.pem
#  - adjust the paths in the acl statements to the URIs of your C2 profile
#  - make sure rsyslog writes facility local2 to /var/log/haproxy.log, e.g.:
#    echo 'local2.* -/var/log/haproxy.log' > /etc/rsyslog.d/49-haproxy.conf && systemctl restart rsyslog
#  - systemctl restart haproxy
#
# Filebeat on this redirector ships /var/log/haproxy.log to the RedELK server, where
# 20-filter-redir-haproxy_logstash.conf parses it.
#
# Backend naming matters to RedELK: names starting with 'c2' mark implant traffic (several
# alarm modules query redir.backend.name:c2*), names containing 'alarm' raise an alarm on
# every hit, and anything else is treated as decoy traffic.
#

global
  log /dev/log local2
  maxconn 2000
  user haproxy
  group haproxy
  # Mozilla "intermediate" profile, see https://ssl-config.mozilla.org/#server=haproxy
  # TLS 1.3 suites are configured separately from the TLS 1.2 ciphers; putting them in
  # ssl-default-bind-ciphers has no effect.
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305

defaults
  log global
  mode http
  option dontlognull
  option redispatch
  retries 3
  timeout connect 5s
  timeout client 1m
  timeout server 1m

  ############################################################################################
  # Exact log-format is important for RedELK - it is what 20-filter-redir-haproxy_logstash.conf
  # greps apart. Field order, the literal labels and the 'headers:{...}' block all matter.
  # %T is the GMT date, %f/%H/%fi:%fp the frontend, %b the backend, %ci:%cp the client,
  # capture.req.hdr(3) the X-Forwarded-For capture and %hr all captured request headers.
  ############################################################################################
  log-format "GMT:%T frontend:%f/%H/%fi:%fp backend:%b client:%ci:%cp xforwardedfor:%[capture.req.hdr(3)] headers:%hr statuscode:%ST request:%r"

frontend www-https
  bind :::443 v4v6 ssl crt /etc/haproxy/certs/redir.pem

  ############################################################################################
  # DO NOT DELETE THE 'declare capture' LINE BELOW - IT IS LOAD-BEARING FOR THE LOG FORMAT.
  #
  # It reserves capture slot 0, which shifts the header captures to slots 1-7. Two things
  # depend on that:
  #  - %hr then renders as '{|useragent|host|xff|xfproto|xhost|forwarded|via}' and RedELK's
  #    Logstash filter matches on that leading empty slot ('headers:{|').
  #  - capture.req.hdr(3) in the log-format above is X-Forwarded-For only because of the shift.
  # Remove the declare line, or reorder the captures, and every request header on this
  # redirector stops being parsed - silently, with no error anywhere.
  ############################################################################################
  declare capture request len 40000
  capture request header User-Agent len 512
  capture request header Host len 512
  capture request header X-Forwarded-For len 512
  capture request header X-Forwarded-Proto len 512
  capture request header X-Host len 512
  capture request header Forwarded len 512
  capture request header Via len 512

  http-response set-header X-Frame-Options DENY
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
  http-request add-header X-Forwarded-Proto https

  # modify the paths below to match the URIs of your C2 profile
  acl path_stage1 path -m beg /s1
  acl path_cobaltstrike path -m beg /TRAINING-BEACON /dpixel /submit.php
  # Cobalt Strike's default stager URI is four random alphanumerics - enable only if you
  # actually stage over this redirector, it matches a lot of scanner noise as well
  #acl path_cobaltstrike path -m reg ^/[a-zA-Z0-9]{4}$

  # paths no visitor of the decoy site would ever request. 'alarm' in the backend name makes
  # RedELK's alarm_backendalarm module fire on every hit
  acl path_honeypot path -m beg /wp-login.php /.git/ /.env

  use_backend c2_stage1_https if path_stage1
  use_backend c2_cobaltstrike_https if path_cobaltstrike
  use_backend alarm-honeypot if path_honeypot
  default_backend decoy-www

frontend www-http
  bind :::80 v4v6

  # see the comment block in frontend www-https - the same applies here
  declare capture request len 40000
  capture request header User-Agent len 512
  capture request header Host len 512
  capture request header X-Forwarded-For len 512
  capture request header X-Forwarded-Proto len 512
  capture request header X-Host len 512
  capture request header Forwarded len 512
  capture request header Via len 512

  http-response set-header X-Frame-Options DENY
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
  http-request add-header X-Forwarded-Proto http

  acl path_stage1 path -m beg /s1
  acl path_cobaltstrike path -m beg /TRAINING-BEACON /dpixel /submit.php
  acl path_honeypot path -m beg /wp-login.php /.git/ /.env

  use_backend c2_stage1_http if path_stage1
  use_backend c2_cobaltstrike_http if path_cobaltstrike
  use_backend alarm-honeypot if path_honeypot
  default_backend decoy-www
  # alternative: send everything that is not C2 traffic to HTTPS
  #http-request redirect scheme https unless path_stage1 || path_cobaltstrike

backend decoy-www
  # a local webserver on 8080, not 80: HAProxy binds 80 itself, so a decoy on 80 loops back in
  http-request set-header Host 127.0.0.1
  server decoy 127.0.0.1:8080

backend c2_cobaltstrike_https
  # Insert X-Forwarded-For header to have Cobalt Strike display the proper IP address of target. Uncomment if you want this functionality
  # Remark: when using Domain Fronting/CDNs, this needs to be commented out as Cobalt Strike does not understand a double inserted X-Forwarded-For header: it will display the IP of the CDN endpoint
  #option forwardfor
  server teamserver 192.0.2.10:443 ssl verify none check inter 30s

backend c2_cobaltstrike_http
  #option forwardfor
  server teamserver 192.0.2.10:80 check inter 30s

backend c2_stage1_https
  server c2server 192.0.2.10:11443 ssl verify none check inter 30s

backend c2_stage1_http
  server c2server 192.0.2.10:11081 check inter 30s

backend alarm-honeypot
  # answer ourselves - the point is the log line, not the content
  http-request return status 404 content-type "text/html" string "<html><head><title>404 Not Found</title></head><body><h1>Not Found</h1></body></html>"

# Part of RedELK
#
# This is an example configuration file for Apache that works with RedELK
#
# Author: Outflank B.V. / Marc Smeets
# With help from: Jason Lang / @curi0usJack
#
# Put this file in /etc/apache2/sites-available and:
#  - modify $$HOSTNAME_OF_THIS_REDIRECTOR, and replace 192.0.2.10 with the IP address of your
#    C2 server. 192.0.2.0/24 is the RFC5737 documentation range: it does not route, so an
#    unedited copy of this file cannot accidentally send beacon traffic anywhere.
#  - modify the RewriteCond lines to match the URIs of your C2 profile
#  - run a2enmod rewrite proxy proxy_http proxy_connect ssl proxy_html deflate headers setenvif
#  - run a2ensite redelk-redir-apache.conf
#  - run apachectl configtest && service apache2 restart
#
# It will log to /var/log/apache2/access-redelk.log - Filebeat on this redirector ships that
# file to the RedELK server, where 21-filter-redir-apache_logstash.conf parses it.
#
# Backend naming matters to RedELK: names starting with 'c2' mark implant traffic (several
# alarm modules query redir.backend.name:c2*), names containing 'alarm' raise an alarm on
# every hit, and anything else is treated as decoy traffic.
#

# Port 80 is already opened by the stock /etc/apache2/ports.conf; a second 'Listen 80' here makes
# Apache refuse to start with "Cannot define multiple Listeners on the same IP:port". Only the
# extra port is declared.
Listen 8070

<VirtualHost *:80>

    DocumentRoot /var/www/html

    ##############################################################################################
    # Exact LogFormat is important for RedELK - it is what 21-filter-redir-apache_logstash.conf
    # greps apart. Field order, the literal labels and the seven header slots between the curly
    # braces all matter, and they are the same seven, in the same order, as in the nginx and
    # HAProxy examples: User-Agent, Host, X-Forwarded-For, X-Forwarded-Proto, X-Host, Forwarded, Via.
    # %>s and not %s: %s is the status of the *original* request, so an internally redirected
    # request would be logged with the status it had before the redirect.
    ##############################################################################################
    LogFormat "%t %{hostname}e apache[%P]: frontend:%{frontend_name}e/%A:%{local}p backend:%{backend_name}e client:%h:%{remote}p xforwardedfor:%{X-Forwarded-For}i headers:{%{User-Agent}i|%{Host}i|%{X-Forwarded-For}i|%{X-Forwarded-Proto}i|%{X-Host}i|%{Forwarded}i|%{Via}i|} statuscode:%>s request:%r"  redelklogformat
    CustomLog ${APACHE_LOG_DIR}/access-redelk.log redelklogformat

    # Set the defaults. Assume all incoming requests are decoys unless changed by RewriteRule below.
    #
    # SetEnvIf and not SetEnv: mod_env applies at the fixup stage, which never runs for a request
    # that mod_rewrite answers itself - i.e. every decoy [R=302] and every [R=404], the bulk of the
    # traffic on a redirector. Those lines used to be logged with 'frontend:-' and a '-' hostname.
    # mod_setenvif applies at post_read_request, before mod_rewrite, so the values are always there,
    # and the E= assignments below still override them. The "^" regex always matches.
    SetEnvIf Request_URI "^" backend_name=decoy
    SetEnvIf Request_URI "^" hostname=$$HOSTNAME_OF_THIS_REDIRECTOR
    # frontend name can be whatever you like
    SetEnvIf Request_URI "^" frontend_name=www-http

    # Enable RewriteEngine
    RewriteEngine On

    # Paths no visitor of the decoy site would ever request. 'alarm' in the backend name makes
    # RedELK's alarm_backendalarm module fire on every hit.
    RewriteCond     %{REQUEST_URI}  ^/wp-login\.php [OR]
    RewriteCond     %{REQUEST_URI}  ^/\.git/ [OR]
    RewriteCond     %{REQUEST_URI}  ^/\.env
    RewriteRule     ^.*$            - [E=backend_name:alarm-honeypot,R=404,L]

    # Send request to C2 backend when it matches specific traffic rules, and set environment variables with E=
    # We want to match specific traffic - correlates with the example Cobalt Strike profile shipped with RedELK :
    #  /dpixel*
    #  /submit.php*
    #  /TRAINING-BEACON*
    #  /XXXX generic stager URI
    RewriteCond		%{REQUEST_URI}	/dpixel [OR]
    RewriteCond		%{REQUEST_URI}	/submit.php [OR]
    RewriteCond		%{REQUEST_URI}	/TRAINING-BEACON [OR]
    RewriteCond		%{REQUEST_URI}	/[0-z][0-z][0-z][0-z]$
    RewriteRule		^.*$ 		http://192.0.2.10%{REQUEST_URI} [E=backend_name:c2-cobaltstrike,P]
    ProxyPassReverse	"/"		"http://192.0.2.10"

    # if request didn't match previous rules, this rule will forward the request to a decoy website with 302 redirect
    RewriteRule		^		https://www.amazon.com [E=backend_name:decoy-amazon,L,R=302]

</VirtualHost>

<VirtualHost *:8070>

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    Options -Indexes
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    ErrorDocument 404 /error_pages/404.txt
    ErrorDocument 403 /error_pages/404.txt

</VirtualHost>

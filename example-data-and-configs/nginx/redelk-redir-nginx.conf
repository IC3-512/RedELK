# Part of RedELK
#
# This is an example configuration file for nginx that works with RedELK
#
# Author: Outflank B.V. / Marc Smeets
# Contributor: Lorenzo Bernardi
#
# Put this file in /etc/nginx/nginx.conf and:
#  - modify www.random-domain.com and the certificate paths
#  - modify the C2 locations to match the URIs of your C2 profile
#  - run nginx -t to check the config, then systemctl reload nginx
#
# It will log to /var/log/nginx/access-redelk.log - Filebeat on this redirector ships that
# file to the RedELK server, where 22-filter-redir-nginx_logstash.conf parses it.
#
# Backend naming matters to RedELK: names starting with 'c2' mark implant traffic (several
# alarm modules query redir.backend.name:c2*), names containing 'alarm' raise an alarm on
# every hit, and anything else is treated as decoy traffic.
#

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {

	# The frontend name is derived from the port so that a request is attributed to the
	# listener that served it. RedELK only uses it as a label, pick names you recognise.
	map $server_port $frontend_name {
		default "www-unknown";
		80      "www-http";
		443     "www-https";
	}

	# Default for every request; the location blocks below override it with 'set'. Without a
	# map there is no value at all for requests that hit no location with a 'set'.
	map $server_port $backend_name {
		default "decoy";
	}

	##############################################################################################
	# Exact log_format is important for RedELK - it is what 22-filter-redir-nginx_logstash.conf
	# greps apart. Field order, the literal labels and the seven header slots between the curly
	# braces all matter, and they are the same seven, in the same order, as in the Apache and
	# HAProxy examples: User-Agent, Host, X-Forwarded-For, X-Forwarded-Proto, X-Host, Forwarded, Via.
	# $http_host (the header as sent) and not $host (normalised, falls back to server_name), so
	# that the logged value is what the client actually asked for - domain fronting shows up here.
	##############################################################################################
	log_format redelklog '[$time_local] $hostname nginx[$pid]: frontend:$frontend_name/$server_addr:$server_port backend:$backend_name client:$remote_addr:$remote_port xforwardedfor:$http_x_forwarded_for headers:{$http_user_agent|$http_host|$http_x_forwarded_for|$http_x_forwarded_proto|$http_x_host|$http_forwarded|$http_via|} statuscode:$status request:$request';

	##
	# Basic Settings
	##
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	# do not advertise the nginx version to whoever is fingerprinting the redirector
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings - Mozilla "intermediate" profile, see https://ssl-config.mozilla.org/#server=nginx
	# TLSv1 and TLSv1.1 are not just weak, they are also a fingerprint: a server that still offers
	# them stands out from the CDN or web host you are trying to blend in with.
	##
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
	# the DHE suites above are only offered when an ssl_dhparam file is configured
	ssl_prefer_server_ciphers off;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access-redelk.log redelklog;
	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	##
	# Virtual Host Configs
	##

	# The Debian/Ubuntu nginx package also includes /etc/nginx/sites-enabled/*, which ships an
	# enabled default site listening on port 80 as default_server. That site would shadow the
	# redirector below for every request that does not match server_name. The vhosts live in
	# this file, so the include is left out - also rm /etc/nginx/sites-enabled/default.
	include /etc/nginx/conf.d/*.conf;

	server {
		# default_server: scanners and blue teams connect to the bare IP address, i.e. without a
		# matching Host header, and that traffic has to be logged and redirected like any other
		listen 80 default_server;
		listen [::]:80 default_server;
		server_name _;

		location / {
			return 301 https://$host$request_uri;
		}
	}

	server {
		listen 443 ssl default_server;
		listen [::]:443 ssl default_server;
		http2 on;
		server_name www.random-domain.com;
		root /var/www/html;

		client_body_buffer_size 10K;
		client_header_buffer_size 1k;
		client_max_body_size 100m;

		ssl_certificate /etc/letsencrypt/live/www.random-domain.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/www.random-domain.com/privkey.pem;

		# C2 traffic - here over an autossh tunnel to the teamserver, listening on localhost.
		# The URI matches the example Cobalt Strike profile in this repository; change it here
		# and in the profile together, or your beacons end up at the decoy site.
		location ~* ^/TRAINING-BEACON {
			set $backend_name c2-cobaltstrike;
			proxy_pass https://127.0.0.1:4433;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		# Paths no visitor of the decoy site would ever request. 'alarm' in the backend name
		# makes RedELK's alarm_backendalarm module fire on every hit.
		location ~* ^/(wp-login\.php|\.git/|\.env) {
			set $backend_name alarm-honeypot;
			return 404;
		}

		# Decoy - everything else. nginx resolves this host name once, at startup, and refuses to
		# start if it cannot: a redirector that quietly dies on a DNS hiccup is worse than one
		# that serves a static decoy, so consider a local site here instead.
		location / {
			set $backend_name decoy-www;
			proxy_pass https://www.example.com;
			proxy_set_header Host www.example.com;
		}
	}
}
